name: cyber-deploy-hub

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyber_deploy_hub}
      POSTGRES_USER: ${POSTGRES_USER:-cyber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data/jetstream", "-m", "8222"]
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats-data:/data/jetstream
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["/app/migrate"]
    command:
      - "-database-url"
      - "${DATABASE_URL:-postgres://cyber:change-me@postgres:5432/cyber_deploy_hub?sslmode=disable}"
      - "-path"
      - "file:///app/migrations"
      - "-action"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: ":8080"
      DATABASE_URL: ${DATABASE_URL:-postgres://cyber:change-me@postgres:5432/cyber_deploy_hub?sslmode=disable}
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-10}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      OS_AUTH_URL: ${OS_AUTH_URL:-https://edu.cyber-infrastructure.ru:5000/v3}
      OS_USERNAME: ${OS_USERNAME:-}
      OS_PASSWORD: ${OS_PASSWORD:-}
      OS_USER_DOMAIN_NAME: ${OS_USER_DOMAIN_NAME:-Hackhaton}
      OS_PROJECT_ID: ${OS_PROJECT_ID:-}
      OS_PROJECT_NAME: ${OS_PROJECT_NAME:-}
      OS_PROJECT_DOMAIN_NAME: ${OS_PROJECT_DOMAIN_NAME:-Hackhaton}
      OS_REGION_NAME: ${OS_REGION_NAME:-}
      OS_ALLOW_REAUTH: ${OS_ALLOW_REAUTH:-true}
      OS_INSECURE: ${OS_INSECURE:-false}
      OS_TIMEOUT: ${OS_TIMEOUT:-20s}
      KI_API_BASE_URL: ${KI_API_BASE_URL:-https://edu.cyber-infrastructure.ru:8800}
      KI_PROJECT_ID: ${KI_PROJECT_ID:-}
      KI_AUTH_TOKEN: ${KI_AUTH_TOKEN:-}
      KI_TIMEOUT: ${KI_TIMEOUT:-10s}
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-8081}:8080"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
  nats-data:
