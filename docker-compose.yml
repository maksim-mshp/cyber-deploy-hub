name: cyber-deploy-hub

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyber_deploy_hub}
      POSTGRES_USER: ${POSTGRES_USER:-cyber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data/jetstream", "-m", "8222"]
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats-data:/data/jetstream
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["/app/migrate"]
    command:
      - "-database-url"
      - "${DATABASE_URL:-postgres://cyber:change-me@postgres:5432/cyber_deploy_hub?sslmode=disable}"
      - "-path"
      - "file:///app/migrations"
      - "-action"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: ":8080"
      DATABASE_URL: ${DATABASE_URL:-postgres://cyber:change-me@postgres:5432/cyber_deploy_hub?sslmode=disable}
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-10}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?set AUTH_SESSION_SECRET}
      AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-8h}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-cdh_session}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_LOCAL_USERS_JSON: ${AUTH_LOCAL_USERS_JSON:-}
      OS_AUTH_URL: ${OS_AUTH_URL:-https://edu.cyber-infrastructure.ru:5000/v3}
      OS_USERNAME: ${OS_USERNAME:-}
      OS_PASSWORD: ${OS_PASSWORD:-}
      OS_USER_DOMAIN_NAME: ${OS_USER_DOMAIN_NAME:-Hackhaton}
      OS_PROJECT_ID: ${OS_PROJECT_ID:-}
      OS_PROJECT_NAME: ${OS_PROJECT_NAME:-}
      OS_PROJECT_DOMAIN_NAME: ${OS_PROJECT_DOMAIN_NAME:-Hackhaton}
      OS_REGION_NAME: ${OS_REGION_NAME:-}
      OS_ALLOW_REAUTH: ${OS_ALLOW_REAUTH:-true}
      OS_INSECURE: ${OS_INSECURE:-false}
      OS_TIMEOUT: ${OS_TIMEOUT:-20s}
      KI_API_BASE_URL: ${KI_API_BASE_URL:-https://edu.cyber-infrastructure.ru:8800}
      KI_PROJECT_ID: ${KI_PROJECT_ID:-}
      KI_AUTH_TOKEN: ${KI_AUTH_TOKEN:-}
      KI_SESSION_COOKIE: ${KI_SESSION_COOKIE:-}
      KI_SESSION_ID: ${KI_SESSION_ID:-1}
      KI_USERNAME: ${KI_USERNAME:-}
      KI_PASSWORD: ${KI_PASSWORD:-}
      KI_DOMAIN_NAME: ${KI_DOMAIN_NAME:-Hackhaton}
      KI_TIMEOUT: ${KI_TIMEOUT:-10s}
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  core-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["/app/core-service"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-postgres://cyber:change-me@postgres:5432/cyber_deploy_hub?sslmode=disable}
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-10}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pidof core-service >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  project-pool-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["/app/project-pool-service"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-postgres://cyber:change-me@postgres:5432/cyber_deploy_hub?sslmode=disable}
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-10}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      OS_AUTH_URL: ${OS_AUTH_URL:-https://edu.cyber-infrastructure.ru:5000/v3}
      OS_USERNAME: ${OS_USERNAME:-}
      OS_PASSWORD: ${OS_PASSWORD:-}
      OS_USER_DOMAIN_NAME: ${OS_USER_DOMAIN_NAME:-Hackhaton}
      OS_PROJECT_ID: ${OS_PROJECT_ID:-}
      OS_PROJECT_NAME: ${OS_PROJECT_NAME:-}
      OS_PROJECT_DOMAIN_NAME: ${OS_PROJECT_DOMAIN_NAME:-Hackhaton}
      OS_REGION_NAME: ${OS_REGION_NAME:-}
      OS_ALLOW_REAUTH: ${OS_ALLOW_REAUTH:-true}
      OS_INSECURE: ${OS_INSECURE:-false}
      OS_TIMEOUT: ${OS_TIMEOUT:-20s}
      PROJECT_POOL_SEED_FILE: ${PROJECT_POOL_SEED_FILE:-}
      PROJECT_POOL_SEED_JSON: ${PROJECT_POOL_SEED_JSON:-}
      PROJECT_POOL_AUTO_IMPORT_OPENSTACK_PROJECT: ${PROJECT_POOL_AUTO_IMPORT_OPENSTACK_PROJECT:-true}
      PROJECT_POOL_DEFAULT_COURSE_ID: ${PROJECT_POOL_DEFAULT_COURSE_ID:-course-3}
      PROJECT_POOL_DEFAULT_DOMAIN_NAME: ${PROJECT_POOL_DEFAULT_DOMAIN_NAME:-Hackhaton}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pidof project-pool-service >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  capacity-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["/app/capacity-service"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-postgres://cyber:change-me@postgres:5432/cyber_deploy_hub?sslmode=disable}
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-10}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      OS_AUTH_URL: ${OS_AUTH_URL:-https://edu.cyber-infrastructure.ru:5000/v3}
      OS_USERNAME: ${OS_USERNAME:-}
      OS_PASSWORD: ${OS_PASSWORD:-}
      OS_USER_DOMAIN_NAME: ${OS_USER_DOMAIN_NAME:-Hackhaton}
      OS_PROJECT_ID: ${OS_PROJECT_ID:-}
      OS_PROJECT_NAME: ${OS_PROJECT_NAME:-}
      OS_PROJECT_DOMAIN_NAME: ${OS_PROJECT_DOMAIN_NAME:-Hackhaton}
      OS_REGION_NAME: ${OS_REGION_NAME:-}
      OS_ALLOW_REAUTH: ${OS_ALLOW_REAUTH:-true}
      OS_INSECURE: ${OS_INSECURE:-false}
      OS_TIMEOUT: ${OS_TIMEOUT:-20s}
      KI_API_BASE_URL: ${KI_API_BASE_URL:-https://edu.cyber-infrastructure.ru:8800}
      KI_PROJECT_ID: ${KI_PROJECT_ID:-}
      KI_AUTH_TOKEN: ${KI_AUTH_TOKEN:-}
      KI_SESSION_COOKIE: ${KI_SESSION_COOKIE:-}
      KI_SESSION_ID: ${KI_SESSION_ID:-1}
      KI_USERNAME: ${KI_USERNAME:-}
      KI_PASSWORD: ${KI_PASSWORD:-}
      KI_DOMAIN_NAME: ${KI_DOMAIN_NAME:-Hackhaton}
      KI_TIMEOUT: ${KI_TIMEOUT:-10s}
      CAPACITY_THRESHOLD_PERCENT: ${CAPACITY_THRESHOLD_PERCENT:-90}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pidof capacity-service >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  cloud-adapter-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["/app/cloud-adapter-service"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-postgres://cyber:change-me@postgres:5432/cyber_deploy_hub?sslmode=disable}
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-10}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      OS_AUTH_URL: ${OS_AUTH_URL:-https://edu.cyber-infrastructure.ru:5000/v3}
      OS_USERNAME: ${OS_USERNAME:-}
      OS_PASSWORD: ${OS_PASSWORD:-}
      OS_USER_DOMAIN_NAME: ${OS_USER_DOMAIN_NAME:-Hackhaton}
      OS_PROJECT_ID: ${OS_PROJECT_ID:-}
      OS_PROJECT_NAME: ${OS_PROJECT_NAME:-}
      OS_PROJECT_DOMAIN_NAME: ${OS_PROJECT_DOMAIN_NAME:-Hackhaton}
      OS_REGION_NAME: ${OS_REGION_NAME:-}
      OS_ALLOW_REAUTH: ${OS_ALLOW_REAUTH:-true}
      OS_INSECURE: ${OS_INSECURE:-false}
      OS_TIMEOUT: ${OS_TIMEOUT:-20s}
      CLOUD_PRIVATE_NETWORK_ID: ${CLOUD_PRIVATE_NETWORK_ID:-}
      CLOUD_PRIVATE_SUBNET_ID: ${CLOUD_PRIVATE_SUBNET_ID:-}
      CLOUD_SECURITY_GROUP_IDS: ${CLOUD_SECURITY_GROUP_IDS:-}
      CLOUD_BLUEPRINT_FILE: ${CLOUD_BLUEPRINT_FILE:-/app/config/lab3_blueprints.json}
      CLOUD_BLUEPRINT_JSON: ${CLOUD_BLUEPRINT_JSON:-}
      CLOUD_KEY_ENCRYPTION_KEY: ${CLOUD_KEY_ENCRYPTION_KEY:-}
      CLOUD_KEY_ENCRYPTION_KEY_ID: ${CLOUD_KEY_ENCRYPTION_KEY_ID:-default}
      CLOUD_DEPLOY_TIMEOUT: ${CLOUD_DEPLOY_TIMEOUT:-20m}
      CLOUD_POLL_INTERVAL: ${CLOUD_POLL_INTERVAL:-5s}
      CLOUD_DELETE_POLL_INTERVAL: ${CLOUD_DELETE_POLL_INTERVAL:-3s}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pidof cloud-adapter-service >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  vdi-gateway-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["/app/vdi-gateway-service"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-postgres://cyber:change-me@postgres:5432/cyber_deploy_hub?sslmode=disable}
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-10}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      OS_AUTH_URL: ${OS_AUTH_URL:-https://edu.cyber-infrastructure.ru:5000/v3}
      OS_USERNAME: ${OS_USERNAME:-}
      OS_PASSWORD: ${OS_PASSWORD:-}
      OS_USER_DOMAIN_NAME: ${OS_USER_DOMAIN_NAME:-Hackhaton}
      OS_PROJECT_ID: ${OS_PROJECT_ID:-}
      OS_PROJECT_NAME: ${OS_PROJECT_NAME:-}
      OS_PROJECT_DOMAIN_NAME: ${OS_PROJECT_DOMAIN_NAME:-Hackhaton}
      OS_REGION_NAME: ${OS_REGION_NAME:-}
      OS_ALLOW_REAUTH: ${OS_ALLOW_REAUTH:-true}
      OS_INSECURE: ${OS_INSECURE:-false}
      OS_TIMEOUT: ${OS_TIMEOUT:-20s}
      VDI_HTTP_ADDR: ":8082"
      VDI_PUBLIC_BASE_URL: ${VDI_PUBLIC_BASE_URL:-http://localhost:8082}
      VDI_ACCESS_TOKEN_TTL: ${VDI_ACCESS_TOKEN_TTL:-15m}
    ports:
      - "${VDI_GATEWAY_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  lifecycle-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["/app/lifecycle-service"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-postgres://cyber:change-me@postgres:5432/cyber_deploy_hub?sslmode=disable}
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-10}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      LIFECYCLE_POLL_INTERVAL: ${LIFECYCLE_POLL_INTERVAL:-5s}
      LIFECYCLE_DUE_BATCH_SIZE: ${LIFECYCLE_DUE_BATCH_SIZE:-25}
      LIFECYCLE_DEFAULT_LAB_TTL: ${LIFECYCLE_DEFAULT_LAB_TTL:-2h}
      LIFECYCLE_DEFAULT_FREEZE_TTL: ${LIFECYCLE_DEFAULT_FREEZE_TTL:-24h}
      LIFECYCLE_DEFAULT_CAPACITY_THRESHOLD: ${LIFECYCLE_DEFAULT_CAPACITY_THRESHOLD:-90}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pidof lifecycle-service >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  checker-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["/app/checker-service"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-postgres://cyber:change-me@postgres:5432/cyber_deploy_hub?sslmode=disable}
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-10}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      CLOUD_KEY_ENCRYPTION_KEY: ${CLOUD_KEY_ENCRYPTION_KEY:-}
      CLOUD_KEY_ENCRYPTION_KEY_ID: ${CLOUD_KEY_ENCRYPTION_KEY_ID:-default}
      CHECKER_PROFILE_FILE: ${CHECKER_PROFILE_FILE:-/app/config/checker_profiles.json}
      CHECKER_PROFILE_JSON: ${CHECKER_PROFILE_JSON:-}
      CHECKER_DEFAULT_SSH_USER: ${CHECKER_DEFAULT_SSH_USER:-ubuntu}
      CHECKER_SSH_PORT: ${CHECKER_SSH_PORT:-22}
      CHECKER_SSH_TIMEOUT: ${CHECKER_SSH_TIMEOUT:-20s}
      CHECKER_COMMAND_TIMEOUT: ${CHECKER_COMMAND_TIMEOUT:-15s}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pidof checker-service >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  lms-gateway-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["/app/lms-gateway-service"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-postgres://cyber:change-me@postgres:5432/cyber_deploy_hub?sslmode=disable}
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-10}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      LMS_HTTP_ADDR: ":8083"
      LMS_SHARED_SECRET: ${LMS_SHARED_SECRET:?set LMS_SHARED_SECRET}
      LMS_ALLOWED_CLOCK_SKEW: ${LMS_ALLOWED_CLOCK_SKEW:-5m}
      LMS_COURSE_MAP_JSON: ${LMS_COURSE_MAP_JSON:-}
      LMS_ASSIGNMENT_MAP_JSON: ${LMS_ASSIGNMENT_MAP_JSON:-}
      LMS_DEFAULT_SOURCE: ${LMS_DEFAULT_SOURCE:-moodle}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?set AUTH_SESSION_SECRET}
      AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-8h}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-cdh_session}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_FRONTEND_URL: ${AUTH_FRONTEND_URL:-/}
    ports:
      - "${LMS_GATEWAY_PORT:-8083}:8083"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8083/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-8081}:8080"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
  nats-data:
